<!doctype html>
<html lang="es">
<head>

<style>
  /* Estilo 4 · Acuarela: lavanda, rosa empolvado, azul cielo y verde menta sobre papel blanco */
  :root{ --fondo:#fbfaf7;--marca:#6fae8a;--fecha:#4a3f6b;--saludo:#7d6fb3;--f-marca:"Cormorant Garamond",Georgia,serif;--f-fecha:"Cormorant Garamond",Georgia,serif;--f-saludo:"Cormorant Garamond",Georgia,serif;--p-marca:500;--p-fecha:italic 400;--p-saludo:italic 400;color-scheme:light }
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:var(--fondo);color:var(--fecha);overflow:hidden;overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
  #lienzo{position:fixed;inset:0;width:100%;height:100%;display:block}
  .cabecera{position:fixed;left:0;right:0;top:calc(26px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:8px;
    text-align:center;pointer-events:none;opacity:0;transition:opacity 1.8s ease}
  .cabecera.on{opacity:1}
  .marca{font:var(--p-marca) 11px/1 var(--f-marca);letter-spacing:.34em;text-transform:uppercase;color:var(--marca)}
  .fecha{font:var(--p-fecha) 25px/1.1 var(--f-fecha);color:var(--fecha)}
  .saludo{max-width:min(82vw,340px);margin-top:4px;font:var(--p-saludo) 18px/1.35 var(--f-saludo);color:var(--saludo);text-wrap:balance}
  .solo{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
  .solo h1{margin:0;font:var(--p-fecha) 44px/1 var(--f-fecha);color:var(--fecha)}
  .solo p{margin:0;font:var(--p-saludo) 19px/1.4 var(--f-saludo);color:var(--saludo)}

<body>
<canvas id="lienzo" aria-label="Animación: un ramo pintado a la acuarela que nace de salpicaduras de color y gira"></canvas>

  <h1>Ramo del día</h1>
  <p>Este ramo solo se abre desde el móvil.</p>
</main>
<script>
// Utilidades comunes de los ramos (se incrustan en cada página).
window.U = (() => {
  const TAU = Math.PI * 2;
  const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
  const eo2 = (u) => 1 - (1 - u) * (1 - u);
  const eo3 = (u) => 1 - (1 - u) * (1 - u) * (1 - u);
  const backOut = (u) => { const c1 = 1.6, c3 = c1 + 1, v = u - 1; return 1 + c3 * v * v * v + c1 * v * v; };
  function rngF(seed) {
    return () => {
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const jit = (rng, a) => (rng() - 0.5) * a;
  function blob(rng, n, r0, amp, freq, ox = 0, oy = 0) {
    const pts = [], ph = rng() * TAU;
    for (let i = 0; i < n; i++) {
      const t = i / n * TAU, r = r0 * (1 + amp * Math.sin(t * freq + ph) + jit(rng, amp * 0.6));
      pts.push([ox + Math.cos(t) * r, oy + Math.sin(t) * r]);
    }
    return pts;
  }
  function camino(c, pts, cerrar = true) {
    c.beginPath();
    c.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
    if (cerrar) c.closePath();
  }
  function lienzo(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
  function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
  function mezcla(h1, h2, t) {
    const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
    const m = (s) => Math.round(((a >> s) & 255) * (1 - t) + ((b >> s) & 255) * t);
    return '#' + ((1 << 24) | (m(16) << 16) | (m(8) << 8) | m(0)).toString(16).slice(1);
  }
  return { TAU, clamp01, eo2, eo3, backOut, rngF, jit, blob, camino, lienzo, rgba, mezcla };
})();
window.M = { DPR: 1, S: 1, W: 0, H: 0 };

</script>
<script>
// Estilo 4 · Acuarela: manchas transparentes que se mezclan, bordes de pigmento, papel blanco.
window.ESTILO = (() => {
  const { TAU, jit, blob, camino, rgba } = window.U;
  const M = window.M;
  const C = {
    papel: '#fbfaf7', lav: '#a79bd0', lavO: '#7d6fb3', rosa: '#e7b7c8', rosaO: '#c98aa2',
    cielo: '#9cc5e0', cieloO: '#6d9fc4', menta: '#a8d5b9', mentaO: '#6fae8a', tinta: '#4a3f6b',
  };
  const COL = { lavanda: [C.lav, C.lavO], rosa: [C.rosa, C.rosaO], cielo: [C.cielo, C.cieloO] };
  const GOTAS = [C.lav, C.rosa, C.cielo, C.menta, C.lavO, C.rosaO];

  function mancha(c, rng, cx, cy, r, col, a) {
    for (let k = 0; k < 3; k++) {
      c.fillStyle = rgba(col, a * (k === 0 ? 0.5 : 0.3));
      camino(c, blob(rng, 20, r * (1 - k * 0.13), 0.13, 3 + k, cx + jit(rng, r * 0.12), cy + jit(rng, r * 0.12)));
      c.fill();
    }
    c.strokeStyle = rgba(col, a * 0.75); c.lineWidth = Math.max(1, r * 0.045);
    camino(c, blob(rng, 20, r * 0.97, 0.1, 3, cx, cy)); c.stroke();
  }
  function flores(c, rng, r) {
    c.fillStyle = 'rgba(255,255,255,0.28)';
    for (let i = 0; i < 4; i++) { camino(c, blob(rng, 10, r * (0.05 + rng() * 0.06), 0.3, 2, jit(rng, r * 1.1), jit(rng, r * 1.1))); c.fill(); }
  }
  function hoja(c, rng, x, y, ang, ln, col, colO) {
    c.save(); c.translate(x, y); c.rotate(ang);
    for (let k = 0; k < 2; k++) {
      const w = ln * (0.3 - k * 0.06);
      c.beginPath(); c.moveTo(0, 0);
      c.bezierCurveTo(ln * 0.3, -w * 1.1 + jit(rng, w * 0.3), ln * 0.7, -w * 0.8, ln, jit(rng, w * 0.2));
      c.bezierCurveTo(ln * 0.7, w * 0.8, ln * 0.3, w * 1.1 + jit(rng, w * 0.3), 0, 0);
      c.fillStyle = rgba(k ? colO : col, k ? 0.35 : 0.55); c.fill();
    }
    c.strokeStyle = rgba(colO, 0.5); c.lineWidth = Math.max(0.8, ln * 0.02);
    c.beginPath(); c.moveTo(ln * 0.05, 0); c.quadraticCurveTo(ln * 0.5, -ln * 0.03, ln * 0.9, 0); c.stroke();
    c.restore();
  }

  return {
    semilla: 20261128, tipos: ['lavanda', 'rosa', 'cielo'], nChispas: 40, burst: 1.0,

    pintarFondo(c, W, H, rng) {
      c.fillStyle = C.papel; c.fillRect(0, 0, W, H);
      for (let k = 0; k < 9; k++) {
        const col = GOTAS[k % GOTAS.length], x = rng() * W, y = rng() * H, r = (0.18 + rng() * 0.3) * Math.max(W, H);
        const g = c.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, rgba(col, 0.09)); g.addColorStop(1, rgba(col, 0));
        c.fillStyle = g; c.fillRect(0, 0, W, H);
      }
      for (let i = 0, n = W * H / 500; i < n; i++) {
        c.fillStyle = rng() < 0.5 ? `rgba(90,80,120,${0.02 + rng() * 0.03})` : `rgba(255,255,255,${0.3 + rng() * 0.3})`;
        c.fillRect(rng() * W, rng() * H, M.DPR, M.DPR);
      }
      const v = c.createRadialGradient(W / 2, H * 0.5, Math.min(W, H) * 0.3, W / 2, H * 0.5, Math.max(W, H) * 0.8);
      v.addColorStop(0, 'rgba(120,100,160,0)'); v.addColorStop(1, 'rgba(120,100,160,0.1)');
      c.fillStyle = v; c.fillRect(0, 0, W, H);
    },

    flor(c, R, tipo, rng) {
      const [col, colO] = COL[tipo];
      const a0 = rng() * TAU;
      for (let i = 0; i < 6; i++) { const a = a0 + i / 6 * TAU; mancha(c, rng, Math.cos(a) * R * 0.48, Math.sin(a) * R * 0.48, R * 0.47, col, 0.95); }
      for (let i = 0; i < 4; i++) { const a = a0 + 0.5 + i / 4 * TAU; mancha(c, rng, Math.cos(a) * R * 0.2, Math.sin(a) * R * 0.2, R * 0.3, colO, 0.6); }
      mancha(c, rng, 0, 0, R * 0.14, C.tinta, 0.5);
      c.fillStyle = rgba(C.tinta, 0.45);
      for (let i = 0; i < 7; i++) { const a = rng() * TAU, d = R * (0.16 + rng() * 0.1); c.beginPath(); c.arc(Math.cos(a) * d, Math.sin(a) * d, R * 0.025, 0, TAU); c.fill(); }
      flores(c, rng, R * 0.7);
    },
    reverso(c, R, tipo, rng) {
      const [col, colO] = COL[tipo];
      mancha(c, rng, 0, 0, R * 0.85, col, 0.7);
      mancha(c, rng, 0, 0, R * 0.55, colO, 0.45);
      for (let i = 0; i < 5; i++) hoja(c, rng, 0, 0, i / 5 * TAU + rng(), R * 0.6, C.menta, C.mentaO);
    },
    rama(c, L, rng, brotes) {
      c.lineCap = 'round';
      c.strokeStyle = rgba(C.mentaO, 0.7); c.lineWidth = L * 0.02;
      c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(L * 0.5, -L * 0.06, L, 0); c.stroke();
      let lado = 1;
      for (let x = L * 0.16; x < L * 0.95; x += L * 0.13) {
        hoja(c, rng, x, -L * 0.03 * Math.sin(Math.PI * x / L), lado * (0.7 + jit(rng, 0.25)), L * (0.25 - 0.08 * x / L), C.menta, C.mentaO);
        lado = -lado;
      }
      if (brotes) for (let b = 0; b < 4; b++) {
        const bx = L * (0.78 + b * 0.07), by = jit(rng, L * 0.14);
        mancha(c, rng, bx, by, L * 0.045, b % 2 ? C.rosa : C.lav, 0.95);
      }
    },
    lazo(c, R) {
      const rng = window.U.rngF(55);
      for (const s of [-1, 1]) {
        c.save(); c.scale(s, 1);
        for (let k = 0; k < 2; k++) {
          c.beginPath(); c.moveTo(0, 0);
          c.bezierCurveTo(R * 0.5, -R * 0.6, R * 1.05, -R * 0.3, R * 0.95, R * 0.05);
          c.bezierCurveTo(R * 0.85, R * 0.4, R * 0.35, R * 0.25, 0, 0);
          c.fillStyle = rgba(k ? C.lavO : C.lav, k ? 0.3 : 0.6); c.fill();
        }
        c.strokeStyle = rgba(C.lavO, 0.7); c.lineWidth = R * 0.05; c.lineCap = 'round';
        c.beginPath(); c.moveTo(R * 0.05, R * 0.1); c.quadraticCurveTo(R * 0.25, R * 0.6, R * 0.4, R * 0.95); c.stroke();
        c.restore();
      }
      mancha(c, rng, 0, 0, R * 0.16, C.lavO, 0.9);
    },
    tallo(ctx, pts) {
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.strokeStyle = rgba(C.mentaO, 0.75); ctx.lineWidth = 2.6 * M.DPR;
      ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for (const p of pts) ctx.lineTo(p.x, p.y); ctx.stroke();
      ctx.strokeStyle = rgba(C.menta, 0.6); ctx.lineWidth = 1.2 * M.DPR;
      ctx.beginPath(); ctx.moveTo(pts[0].x - M.DPR, pts[0].y); for (const p of pts) ctx.lineTo(p.x - M.DPR, p.y); ctx.stroke();
    },
    conoInterior(ctx, hull) {
      ctx.fillStyle = rgba(C.lav, 0.45);
      camino(ctx, hull.map((p) => [p.x, p.y])); ctx.fill();
      ctx.fillStyle = rgba(C.cieloO, 0.18);
      camino(ctx, hull.map((p) => [p.x + 6 * M.DPR, p.y + 4 * M.DPR])); ctx.fill();
    },
    conoFrente(ctx, arc, barc, cono) {
      const forma = arc.map((p) => [p.x, p.y]).concat(barc.slice().reverse().map((p) => [p.x, p.y]));
      ctx.fillStyle = 'rgba(251,250,247,0.92)'; camino(ctx, forma); ctx.fill();
      ctx.fillStyle = rgba(C.rosa, 0.55); camino(ctx, forma); ctx.fill();
      ctx.fillStyle = rgba(C.lav, 0.22); camino(ctx, forma.map(([x, y]) => [x + 5 * M.DPR, y + 3 * M.DPR])); ctx.fill();
      ctx.lineCap = 'round';
      for (let k = 0; k < 16; k++) {
        const i = Math.round(((k / 16) * TAU + 0.15) % TAU / TAU * cono.N) % cono.N, a = cono.top[i], b = cono.bot[i];
        if (a.z < 0.02) continue;
        ctx.strokeStyle = rgba(C.rosaO, 0.35); ctx.lineWidth = 3 * M.DPR;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
      ctx.strokeStyle = rgba(C.rosaO, 0.7); ctx.lineWidth = 1.6 * M.DPR;
      camino(ctx, arc.map((p) => [p.x, p.y]), false); ctx.stroke();
    },
    cinta(ctx, tramos, bw) {
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (const tr of tramos) {
        ctx.strokeStyle = rgba(C.lav, 0.65); ctx.lineWidth = bw * tr[0].k;
        camino(ctx, tr.map((p) => [p.x, p.y]), false); ctx.stroke();
        ctx.strokeStyle = rgba(C.lavO, 0.5); ctx.lineWidth = 1.4 * M.DPR;
        camino(ctx, tr.map((p) => [p.x, p.y + bw * 0.45 * p.k]), false); ctx.stroke();
      }
    },
    cohete(ctx, pos, estela, t, fi) {
      estela.forEach((q, k) => {
        ctx.fillStyle = rgba(GOTAS[(fi + k) % 4], 0.55 - k * 0.06);
        ctx.beginPath(); ctx.arc(q.x, q.y + k * 1.5 * M.DPR, (3.2 - k * 0.35) * M.DPR, 0, TAU); ctx.fill();
      });
      ctx.fillStyle = rgba(C.lavO, 0.85);
      ctx.beginPath(); ctx.ellipse(pos.x, pos.y, 4 * M.DPR, 5.5 * M.DPR, 0, 0, TAU); ctx.fill();
    },
    estallido(ctx, x, y, R, tau, chispas) {
      if (tau < 0.35) {
        const u = tau / 0.35;
        ctx.fillStyle = rgba(GOTAS[Math.floor(chispas[0][3] * 4)], 0.25 * (1 - u));
        ctx.beginPath(); ctx.arc(x, y, R * (0.6 + 1.4 * u), 0, TAU); ctx.fill();
      }
      for (const [a, d, life, h, h2] of chispas) {
        const L = life * 1.5; if (tau > L) continue;
        const age = tau / L, e = 1 - Math.exp(-4 * tau);
        const px = x + Math.cos(a) * R * d * 1.5 * e, py = y + Math.sin(a) * R * d * 1.5 * e + R * 0.4 * tau * tau;
        ctx.fillStyle = rgba(GOTAS[Math.floor(h * GOTAS.length)], 0.55 * (1 - age));
        ctx.beginPath(); ctx.arc(px, py, (1.5 + h2 * 4.5) * M.DPR * (1 + age * 0.6), 0, TAU); ctx.fill();
      }
    },
    ambiente(ctx, x, y, R, tau, k) {
      const e = 1 - Math.exp(-3 * tau);
      for (let j = 0; j < 14; j++) {
        const a = j / 14 * TAU + k;
        ctx.fillStyle = rgba(GOTAS[(j + k) % GOTAS.length], 0.35 * (1 - tau / 1.8));
        ctx.beginPath(); ctx.arc(x + Math.cos(a) * R * 1.4 * e, y + Math.sin(a) * R * 1.4 * e + R * 0.4 * tau * tau, (2 + (j % 3)) * M.DPR, 0, TAU); ctx.fill();
      }
    },
  };
})();

</script>
<script>
// Motor común: fuegos artificiales que forman el ramo, hojas, envoltorio, cinta, lazo y giro de 360°.
// El aspecto lo pone window.ESTILO (cada día uno distinto).
(() => {
'use strict';
const { TAU, clamp01, eo2, backOut, rngF, jit, lienzo } = window.U;
const E = window.ESTILO, M = window.M;
const cv = document.getElementById('lienzo');
const cab = document.getElementById('cab');
if (!window.ES_MOVIL) {
  cv.hidden = true; cab.hidden = true;
  document.getElementById('solo').hidden = false;
  return;
}
const ctx = cv.getContext('2d');

/* ---------- Tiempo (s) ---------- */
const T0 = 0.45, STG = 0.27, ROCK = 0.6, BURST = E.burst || 0.9, BLOOM = 0.8;
const T_HOJA = 3.6, T_CONO = 4.85, D_CONO = 0.9, T_CINTA = 5.7, D_CINTA = 0.45, T_LAZO = 6.0, D_LAZO = 0.5;
const T_ROT = 6.6, RAMP = 1.2;
let PERIOD = 8;

/* ---------- Cámara y envoltorio ---------- */
const TILT = 0.3, FOC = 4.2, CT = Math.cos(TILT), ST = Math.sin(TILT);
let CA = 1, SA = 0, BOB = 0;
const YB = -0.75, SLOPE = 0.55, R0 = 0.08, Y_CINTA = -0.42;
const coneR = (y) => R0 + (y - YB) * SLOPE;
const yTop = (th) => 0.05 - 0.13 * Math.sin(th) + 0.03 * Math.abs(Math.sin(th * 4.5));

let W = 0, H = 0, DPR = 1, S = 1, CX = 0, CY = 0, fondo = null;
function proj(x, y, z) {
  const X1 = x * CA + z * SA, Z1 = z * CA - x * SA;
  const Y2 = y * CT - Z1 * ST, Z2 = y * ST + Z1 * CT;
  const k = FOC / (FOC - Z2);
  return { x: CX + X1 * S * k, y: CY - (Y2 + BOB) * S * k, z: Z2, k };
}
function rotN(x, y, z) {
  const X1 = x * CA + z * SA, Z1 = z * CA - x * SA;
  return [X1, y * CT - Z1 * ST, y * ST + Z1 * CT];
}

/* ---------- Escena ---------- */
let FL = [], RAMAS = [], LAZO = null;
function crearEscena() {
  const rng = rngF(E.semilla), tp = E.tipos;
  FL = [];
  const defs = [[tp[0], 0, 0.58, 0, 0.18]];
  const t1 = [tp[1], tp[2], tp[0], tp[1], tp[2]];
  for (let i = 0; i < 5; i++) { const a = i / 5 * TAU + 0.3; defs.push([t1[i], Math.cos(a) * 0.26, 0.42, Math.sin(a) * 0.26, 0.165]); }
  const t2 = [tp[0], tp[1], tp[2], tp[0], tp[1], tp[2]];
  for (let i = 0; i < 6; i++) { const a = i / 6 * TAU + 0.3 + TAU / 12; defs.push([t2[i], Math.cos(a) * 0.44, 0.22, Math.sin(a) * 0.44, 0.155]); }
  const order = [0, 1, 3, 5, 2, 4, 6, 8, 10, 7, 9, 11];
  defs.forEach((d, i) => {
    const c = [d[1], d[2], d[3]], r = d[4];
    let nx = c[0], ny = c[1] + 0.6, nz = c[2];
    { const l = Math.hypot(nx, ny, nz); nx /= l; ny /= l; nz /= l; }
    const hxz = Math.hypot(c[0], c[2]), ex = hxz > 1e-6 ? c[0] / hxz : 0, ez = hxz > 1e-6 ? c[2] / hxz : 0;
    const Ep = [ex * 0.035, -0.92, ez * 0.035], Tp = [ex * 0.025, Y_CINTA, ez * 0.025];
    const B = [c[0] - nx * r * 0.7, c[1] - ny * r * 0.7, c[2] - nz * r * 0.7];
    const pts = [Ep, Tp, B, c], cum = [0];
    for (let k = 1; k < 4; k++) cum.push(cum[k - 1] + Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1], pts[k][2] - pts[k - 1][2]));
    const tl = T0 + order.indexOf(i) * STG;
    const chispas = [];
    for (let j = 0, n = E.nChispas || 44; j < n; j++) chispas.push([rng() * TAU, 0.5 + rng() * 1.6, 0.6 + rng() * 0.9, rng(), rng()]);
    FL.push({ tipo: d[0], c, r, n: [nx, ny, nz], rot: rng() * TAU, seed: Math.floor(rng() * 1e9), pts, cum, len: cum[3], stemLen: cum[2], tl, te: tl + ROCK, chispas });
  });
  RAMAS = [];
  for (let j = 0; j < 7; j++) {
    const a = j / 7 * TAU + 0.2 + jit(rng, 0.25), ca = Math.cos(a), sa = Math.sin(a);
    RAMAS.push({ a: [ca * 0.28, 0.06, sa * 0.28], b: [ca * 0.74, -0.06 + jit(rng, 0.08), sa * 0.74], brotes: false, seed: Math.floor(rng() * 1e9), t0: T_HOJA + j * 0.11 });
  }
  for (let j = 0; j < 5; j++) {
    const a = j / 5 * TAU + 0.9 + jit(rng, 0.3), ca = Math.cos(a), sa = Math.sin(a);
    RAMAS.push({ a: [ca * 0.3, 0.22, sa * 0.3], b: [ca * 0.6, 0.6 + jit(rng, 0.08), sa * 0.6], brotes: true, seed: Math.floor(rng() * 1e9), t0: T_HOJA + 0.4 + j * 0.12 });
  }
}
function hacerFondo() {
  fondo = lienzo(W, H);
  E.pintarFondo(fondo.getContext('2d'), W, H, rngF(E.semilla + 3));
}
function hacerSprites() {
  for (const f of FL) {
    const R = f.r * S, sz = Math.ceil(R * 2.8);
    const dib = (fn) => { const cvs = lienzo(sz, sz), c = cvs.getContext('2d'); c.translate(sz / 2, sz / 2); fn(c); return cvs; };
    f.spr = dib((c) => E.flor(c, R, f.tipo, rngF(f.seed)));
    f.sprR = dib((c) => E.reverso(c, R, f.tipo, rngF(f.seed + 1)));
    f.sz = sz;
  }
  for (const r of RAMAS) {
    const L0 = 0.48 * S, cvs = lienzo(L0 * 1.15 + 10 * DPR, L0 * 0.7), c = cvs.getContext('2d');
    c.translate(5 * DPR, L0 * 0.35);
    E.rama(c, L0, rngF(r.seed), r.brotes);
    r.L0 = L0; r.spr = cvs; r.ox = 5 * DPR; r.oy = L0 * 0.35;
  }
  const RB = 0.12 * S, cvs = lienzo(RB * 2.6, RB * 2.6), c = cvs.getContext('2d');
  c.translate(RB * 1.3, RB * 1.0);
  E.lazo(c, RB);

}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = Math.round(window.innerWidth * DPR); H = Math.round(window.innerHeight * DPR);
  cv.width = W; cv.height = H;
  S = Math.min(H * 0.72 / 1.75, W * 0.84 / 1.3);
  CX = W / 2; CY = H * 0.56 - 0.085 * S;
  M.DPR = DPR; M.S = S; M.W = W; M.H = H;
  hacerFondo();
  hacerSprites();
}

/* ---------- Dibujo por fotograma ---------- */
function pathAt(f, L) {
  const p = f.pts, c = f.cum;
  let k = 0;
  while (k < 2 && c[k + 1] < L) k++;
  const u = clamp01((L - c[k]) / ((c[k + 1] - c[k]) || 1)), a = p[k], b = p[k + 1];
  return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u];
}
function dibujarTallo(f, L) {
  const pts = [proj(...f.pts[0])];
  for (let k = 1; k < 3; k++) {
    if (f.cum[k] <= L) pts.push(proj(...f.pts[k]));
    else { pts.push(proj(...pathAt(f, L))); break; }
  }
  E.tallo(ctx, pts);
}
function dibujarFlor(f, t) {
  const u = clamp01((t - f.te - 0.15) / BLOOM);
  if (u <= 0) return;
  const P = proj(...f.c), N = rotN(...f.n);
  const fac = 0.5 + 0.5 * Math.abs(N[2]);
  const th = Math.atan2(-N[1], N[0]);
  const s = u < 1 ? Math.max(0.05, backOut(u)) : 1;
  const giro = (1 - (1 - (1 - u) ** 3)) * -0.9;
  ctx.save();
  ctx.translate(P.x, P.y);
  ctx.rotate(th); ctx.scale(fac, 1); ctx.rotate(-th + f.rot + giro);
  const D = f.sz * P.k * s;
  ctx.globalAlpha = clamp01(u * 1.6);
  ctx.drawImage(N[2] < -0.3 ? f.sprR : f.spr, -D / 2, -D / 2, D, D);
  ctx.restore();
}
function dibujarRama(r, t) {
  const g = eo2(clamp01((t - r.t0) / 0.7));
  if (g <= 0) return;
  const A = proj(...r.a), B = proj(...r.b);
  const dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy);
  if (len < 1) return;
  const sc = len / r.L0;
  ctx.save();
  ctx.translate(A.x, A.y); ctx.rotate(Math.atan2(dy, dx)); ctx.scale(sc * g, sc * (0.4 + 0.6 * g));
  ctx.globalAlpha = clamp01(g * 1.5);
  ctx.drawImage(r.spr, -r.ox, -r.oy);
  ctx.restore();
}
function aro(y0fn, rfn, n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const th = i / n * TAU, y = y0fn(th), r = rfn(y, th);
    const p = proj(Math.cos(th) * r, y, Math.sin(th) * r); p.th = th; p.c = Math.cos(th); out.push(p);
  }
  return out;
}
function envolvente(pts) {
  const p = pts.slice().sort((a, b) => a.x - b.x || a.y - b.y);
  const cr = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const lo = [], up = [];
  for (const q of p) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
  return lo.slice(0, -1).concat(up.slice(0, -1));
}
function arcoFrontal(pts) {
  const n = pts.length;
  let i0 = -1;
  for (let i = 0; i < n; i++) if (pts[(i - 1 + n) % n].z < 0 && pts[i].z >= 0) { i0 = i; break; }
  if (i0 < 0) return pts.slice();
  const arc = [];
  for (let k = 0; k < n; k++) { const q = pts[(i0 + k) % n]; if (q.z < 0) break; arc.push(q); }
  return arc;
}
let cono = null;
function calcularCono() {
  const N = 96;
  const top = aro(yTop, (y, th) => coneR(y) * (1 + 0.04 * Math.sin(th * 9)), N);
  const bot = aro(() => YB, () => R0, N);
  cono = { top, bot, hull: envolvente(top.concat(bot)), N };
}
function clipCono(q) {
  if (q >= 1) return;
  const yb = proj(0, YB - 0.05, 0).y, yt = proj(0, 0.3, 0).y, y = yb + (yt - yb) * eo2(q);
  ctx.beginPath(); ctx.rect(0, y, W, H - y); ctx.clip();
}
function dibujarConoInterior(q) {
  ctx.save(); clipCono(q); E.conoInterior(ctx, cono.hull); ctx.restore();
}
function dibujarConoFrente(q) {
  const arc = arcoFrontal(cono.top);
  if (arc.length < 2) return;
  const barc = arc.map((p) => cono.bot[Math.round(p.th / TAU * cono.N) % cono.N]);
  ctx.save(); clipCono(q); E.conoFrente(ctx, arc, barc, cono); ctx.restore();
}
function dibujarCinta(t) {
  const q = clamp01((t - T_CINTA) / D_CINTA);
  if (q <= 0) return;
  const r = coneR(Y_CINTA) * 1.06 + 0.012, n = 80, pts = [];
  for (let i = 0; i <= n; i++) {
    const th = i / n * TAU, dd = Math.abs(((th - Math.PI / 2 + 3 * Math.PI) % TAU) - Math.PI);
    const p = proj(Math.cos(th) * r, Y_CINTA, Math.sin(th) * r);
    p.ok = p.z >= -0.01 && dd <= q * Math.PI + 0.01; p.c = Math.cos(th); pts.push(p);
  }
  let cur = null; const tramos = [];
  for (const p of pts) { if (p.ok) { if (!cur) { cur = []; tramos.push(cur); } cur.push(p); } else cur = null; }
  E.cinta(ctx, tramos.filter((tr) => tr.length > 1), 0.05 * S);
}
function dibujarLazo(t) {
  if (t < T_LAZO) return;
  const u = clamp01((t - T_LAZO) / D_LAZO), s = u < 1 ? Math.max(0, backOut(u)) : 1;
  const r = coneR(Y_CINTA) * 1.06 + 0.03;
  const p = proj(0, Y_CINTA, r), N = rotN(0, 0, 1);
  if (N[2] < 0.12) return;
  ctx.save(); ctx.translate(p.x, p.y); ctx.scale(N[2] * s * p.k, s * p.k);
  ctx.drawImage(LAZO.spr, -LAZO.ox, -LAZO.oy);
  ctx.restore();
}
function dibujarCohete(f, t, fi) {
  const u = (t - f.tl) / ROCK;
  const pos = proj(...pathAt(f, eo2(u) * f.len));
  const estela = [];
  for (let k = 1; k <= 7; k++) { const uk = u - k * 0.025; if (uk < 0) break; estela.push(proj(...pathAt(f, eo2(uk) * f.len))); }
  E.cohete(ctx, pos, estela, t, fi);
}
function dibujarEstallido(f, t) {
  const tau = t - f.te;
  if (tau < 0 || tau > BURST + 0.7) return;
  const p0 = proj(...f.c);
  E.estallido(ctx, p0.x, p0.y, f.r * S * p0.k, tau, f.chispas, t);
}
function dibujarAmbiente(t) {
  if (t < T_ROT || !E.ambiente) return;
  const per = 2.2, base = T_ROT + 0.4, kmax = Math.floor((t - base) / per);
  for (let k = Math.max(0, kmax - 1); k <= kmax; k++) {
    const tau = t - (base + k * per); if (tau < 0 || tau > 1.8) continue;
    const h1 = (Math.sin(k * 12.9898) * 43758.5453) % 1, h2 = (Math.sin(k * 78.233) * 12543.123) % 1;
    const lado = k % 2 ? 1 : -1;
    E.ambiente(ctx, W * 0.5 + lado * W * (0.22 + Math.abs(h1) * 0.18), H * (0.2 + Math.abs(h2) * 0.1), S * 0.1, tau, k);
  }
}

function render(t) {
  let a = 0; BOB = 0;
  if (t > T_ROT) {
    const dt = t - T_ROT;
    a = ((TAU / PERIOD) * (dt - RAMP * (1 - Math.exp(-dt / RAMP)))) % TAU;
    BOB = 0.02 * Math.sin(dt * 1.4) * Math.min(1, dt / 2);
  }
  CA = Math.cos(a); SA = Math.sin(a);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(fondo, 0, 0);
  if (E.fondoAnimado) E.fondoAnimado(ctx, t);
  dibujarAmbiente(t);
  const qC = clamp01((t - T_CONO) / D_CONO);
  if (qC > 0) { calcularCono(); dibujarConoInterior(qC); }
  for (const f of FL) {
    if (t < f.tl) continue;
    const L = t < f.te ? eo2((t - f.tl) / ROCK) * f.len : f.len;
    dibujarTallo(f, Math.min(L, f.stemLen));
  }
  const items = [];
  for (const f of FL) if (t > f.te) items.push({ z: proj(...f.c).z, d: () => dibujarFlor(f, t) });
  for (const r of RAMAS) if (t > r.t0) items.push({ z: proj((r.a[0] + r.b[0]) / 2, (r.a[1] + r.b[1]) / 2, (r.a[2] + r.b[2]) / 2).z - 0.05, d: () => dibujarRama(r, t) });
  items.sort((p, q) => p.z - q.z);
  for (const it of items) it.d();
  if (qC > 0) dibujarConoFrente(qC);
  dibujarCinta(t);
  dibujarLazo(t);
  FL.forEach((f, i) => { if (t >= f.tl && t < f.te) dibujarCohete(f, t, i); dibujarEstallido(f, t); });
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

/* ---------- Bucle ---------- */
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let tStart = performance.now();
function reiniciar() { tStart = performance.now() - (reduce ? (T_ROT + 0.2) * 1000 : 0); }
if (reduce) PERIOD = 16;
function loop(now) { render((now - tStart) / 1000); requestAnimationFrame(loop); }
window.addEventListener('pointerdown', reiniciar);
let rt = 0;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 150); });
crearEscena();
resize();
reiniciar();
requestAnimationFrame(loop);
setTimeout(() => cab.classList.add('on'), 250);
})();
