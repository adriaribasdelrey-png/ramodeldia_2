<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calendario de Adviento</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c1530">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&display=swap">
<style>
  /* Pueblo nevado ilustrado con luz suave: noche azul, ventanas cálidas, tejados burdeos y nieve */
  :root{
    --noche:#0c1530; --noche2:#1c2c55; --nieve:#f3f6ff; --luz:#ffd27a; --oro:#d4af37; --oro2:#b8902a;
    --burdeos:#7a1f2e; --burdeos2:#5c1424; --papel:#fbf5ea; --papel2:#f1e6cf; --tinta:#3b2a1e;
    --f:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
    color-scheme:dark;
  }
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:var(--noche);color:var(--nieve);overflow:hidden;overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
  #pueblo{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
  .cab{position:fixed;left:0;right:0;top:calc(66px + env(safe-area-inset-top,0px));z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px;
    text-align:center;pointer-events:none}
  .cab small{font:600 11px/1 var(--f);letter-spacing:.34em;text-transform:uppercase;color:var(--oro)}
  .cab h1{margin:0;font:italic 500 40px/1.05 var(--f);color:var(--nieve);text-shadow:0 0 24px rgba(255,210,122,.35)}
  .cab p{margin:0;font:italic 400 18px/1.3 var(--f);color:#c9d3ee}
  .maqueta{position:fixed;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:3;
    font:600 10px/1 var(--f);letter-spacing:.14em;text-transform:uppercase;color:var(--noche);background:var(--luz);padding:5px 9px;border-radius:999px}
  .aviso{position:fixed;left:50%;bottom:calc(44px + env(safe-area-inset-bottom,0px));z-index:4;transform:translate(-50%,8px);
    font:italic 400 18px/1.2 var(--f);color:var(--nieve);background:rgba(12,21,48,.82);padding:10px 18px;border-radius:999px;white-space:nowrap;
    border:1px solid rgba(212,175,55,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .3s,transform .3s}
  .aviso.on{opacity:1;transform:translate(-50%,0)}

  /* Tarjeta de Navidad: juego y vale */
  .puerta{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
    padding:calc(14px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));
    background:radial-gradient(ellipse at 50% 40%,rgba(28,44,85,.55),rgba(6,10,24,.86));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  .tarjeta{position:relative;width:min(100%,370px);max-height:100%;overflow-y:auto;border-radius:16px;color:var(--tinta);
    padding:26px 22px 24px;transform-origin:var(--ox,50%) var(--oy,80%);
    background:radial-gradient(circle at 20% 10%,#fffdf8,transparent 60%),radial-gradient(circle at 90% 100%,#efe1c4,transparent 55%),var(--papel);
    box-shadow:0 30px 60px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.6) inset}
  .tarjeta::before{content:"";position:absolute;inset:8px;border-radius:11px;border:1px solid var(--oro);pointer-events:none}
  .tarjeta::after{content:"";position:absolute;inset:12px;border-radius:8px;border:1px solid rgba(122,31,46,.35);pointer-events:none}
  .puerta.entra .tarjeta{animation:entra .55s cubic-bezier(.2,.8,.2,1) both}
  .puerta.entra{animation:velo .4s ease both}
  @keyframes entra{from{opacity:0;transform:scale(.18) translateY(20px)}to{opacity:1;transform:none}}
  @keyframes velo{from{opacity:0}to{opacity:1}}
  .t-cab{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;margin-bottom:14px}
  .t-cab small{font:600 10px/1 var(--f);letter-spacing:.3em;text-transform:uppercase;color:var(--oro2)}
  .t-cab h2{margin:0;font:italic 500 46px/1 var(--f);color:var(--burdeos)}
  .acebo{width:70px;height:22px;display:block}
  .cerrar{position:absolute;top:16px;right:16px;z-index:2;width:38px;height:38px;border-radius:50%;cursor:pointer;
    font:500 24px/1 var(--f);color:var(--burdeos);background:transparent;border:1px solid rgba(184,144,42,.6)}
  .cerrar:focus-visible,.carta:focus-visible{outline:2px solid var(--burdeos);outline-offset:3px}
  .t-sub{margin:0 0 14px;text-align:center;font:italic 400 18px/1.35 var(--f);color:#6b5646}
  .tablero{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;perspective:700px}
  .carta{position:relative;aspect-ratio:3/4;border:0;padding:0;background:none;cursor:pointer}
  .giro{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
  .carta.vista .giro,.carta.hecha .giro{transform:rotateY(180deg)}
  .dorso,.frente{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .dorso{background:radial-gradient(circle,rgba(212,175,55,.4) 0 1.4px,transparent 2px) 0 0/12px 12px,linear-gradient(160deg,#8f2638,#5c1424);
    box-shadow:inset 0 0 0 2px #5c1424,inset 0 0 0 3px rgba(212,175,55,.55),0 4px 10px rgba(60,20,20,.25)}
  .dorso::after{content:"✦";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:20px/1 var(--f);color:rgba(240,215,122,.9)}
  .frente{transform:rotateY(180deg);display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 35%,#fffdf6,#f3e7cd);box-shadow:inset 0 0 0 1px rgba(184,144,42,.5),0 4px 10px rgba(60,40,20,.18)}
  .frente canvas{width:78%;height:auto;aspect-ratio:1}
  .carta.hecha .frente{box-shadow:inset 0 0 0 2px var(--oro),0 0 14px rgba(212,175,55,.55)}
  .carta.mal .giro{animation:temblor .35s ease}
  @keyframes temblor{25%{translate:-3px 0}75%{translate:3px 0}}
  .t-pie{display:flex;justify-content:space-between;margin-top:14px;font:italic 400 17px/1 var(--f);color:#7d6654}
  .premio{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
  .premio .msg{margin:0;font:italic 400 20px/1.55 var(--f);color:var(--tinta);max-width:30ch}
  .vale{position:relative;width:100%;max-width:290px;padding:18px 22px 20px;color:var(--burdeos);text-align:center;
    background:radial-gradient(circle at 0 50%,transparent 11px,#f3e3c3 12px) left/51% 100% no-repeat,
               radial-gradient(circle at 100% 50%,transparent 11px,#f3e3c3 12px) right/51% 100% no-repeat;
    filter:drop-shadow(0 6px 10px rgba(80,50,20,.2))}
  .vale::before{content:"";position:absolute;inset:7px 16px;border:1px dashed rgba(122,31,46,.45);border-radius:4px;pointer-events:none}
  .vale small{display:block;font:600 11px/1 var(--f);letter-spacing:.3em;text-transform:uppercase;color:var(--oro2);margin-bottom:8px}
  .vale span{font:italic 500 21px/1.35 var(--f)}
  .premio.entra>*{animation:sube .6s cubic-bezier(.2,.8,.2,1) both}
  .premio.entra>*:nth-child(2){animation-delay:.18s}
  @keyframes sube{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.puerta.entra .tarjeta,.puerta.entra,.premio.entra>*{animation:none}.giro{transition:none}}
  .volver{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));z-index:5;
    font:italic 500 16px/1 var(--f);color:var(--nieve);text-decoration:none;padding:9px 14px 10px;border-radius:999px;
    background:rgba(12,21,48,.6);border:1px solid rgba(212,175,55,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .volver:focus-visible{outline:2px solid var(--luz);outline-offset:3px}
  .solo{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:var(--noche)}
  .solo h1{margin:0;font:italic 500 42px/1 var(--f);color:var(--nieve)}
  .solo p{margin:0;font:italic 400 19px/1.4 var(--f);color:var(--luz)}
</style>
<script>
  // Solo móviles y tabletas: en ordenador se muestra un aviso.
  window.ES_MOVIL = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
    (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
</script>
</head>
<body>
<canvas id="pueblo" aria-label="Pueblo nevado de noche con 24 casas: cada una es una puerta del calendario de Adviento"></canvas>
<header class="cab">
  <small>Calendario de Adviento</small>
  <h1 id="hoyTxt">Diciembre</h1>
  <p id="cuenta">—</p>
</header>
<div class="maqueta" id="maqueta" hidden>Maqueta · como si fuera 1 de diciembre</div>
<a class="volver" href="../">← Ramo del día</a>
<main class="solo" id="solo" hidden>
  <h1>Calendario de Adviento</h1>
  <p>Este calendario solo se abre desde el móvil.</p>
</main>
<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<section class="puerta" id="puerta" role="dialog" aria-modal="true" aria-labelledby="pTitulo" hidden>
  <div class="tarjeta" id="tarjeta">
    <button class="cerrar" id="pCerrar" type="button" aria-label="Cerrar">×</button>
    <div class="t-cab">
      <small>Calendario de Adviento</small>
      <h2 id="pTitulo">Día 1</h2>
      <svg class="acebo" viewBox="0 0 70 22" aria-hidden="true">
        <path d="M33 11c-6-7-15-8-22-4 5 1 7 4 7 7 4-3 9-4 15-3Z" fill="#2f6b4a"/>
        <path d="M37 11c6-7 15-8 22-4-5 1-7 4-7 7-4-3-9-4-15-3Z" fill="#3d8059"/>
        <circle cx="35" cy="12" r="3.4" fill="#b3263a"/><circle cx="30.5" cy="14.5" r="3" fill="#c9374b"/><circle cx="39.5" cy="14.5" r="3" fill="#a31f33"/>
        <circle cx="34" cy="10.8" r="1" fill="#fff" opacity=".7"/>
      </svg>
    </div>
    <div id="juego">
      <p class="t-sub">Encuentra las parejas para abrir la puerta.</p>
      <div class="tablero" id="tablero"></div>
      <div class="t-pie"><span id="movs">0 intentos</span><span id="pares">0 de 6 parejas</span></div>
    </div>
    <div class="premio" id="premio" hidden>
      <p class="msg" id="pMsg"></p>
      <div class="vale"><small>Vale por</small><span id="pVale"></span></div>
    </div>
  </div>
</section>

<script>
(() => {
'use strict';
if (!window.ES_MOVIL) {
  for (const el of document.querySelectorAll('#pueblo, .cab, .volver')) el.hidden = true;
  document.getElementById('solo').hidden = false;
  return;
}
/* ---------- Ajustes ---------- */
// Versión real: usa la fecha del servidor. (Para probar, poner aquí una fecha como '2026-12-01T09:00'.)
const MAQUETA = '';
const ANIO = 2026, HORA_APERTURA = 7, ZONA = 'Europe/Madrid';
const DIAS = {
  1: { juego: 'parejas',
       msg: 'Empieza diciembre y empieza la cuenta atrás: veinticuatro puertas, una cada mañana. Esta es la primera, y ya tiene premio.',
       vale: 'un chocolate caliente, cuando tú quieras.' },
};
const TAU = Math.PI * 2;
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

/* ---------- Fecha que no se puede trucar (hora del servidor, no del móvil) ---------- */
async function horaFiable() {
  if (MAQUETA) return { fecha: new Date(MAQUETA + ':00+01:00'), fiable: true };
  try {
    const r = await fetch(location.href.split('#')[0], { method: 'HEAD', cache: 'no-store' });
    const d = r.headers.get('date');
    if (d) return { fecha: new Date(d), fiable: true };
  } catch (e) { /* sin conexión */ }
  return { fecha: new Date(), fiable: false };
}
function partes(fecha) {
  const f = new Intl.DateTimeFormat('en-GB', { timeZone: ZONA, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', hourCycle: 'h23' }).formatToParts(fecha);
  const g = (t) => Number(f.find((p) => p.type === t).value);
  return { y: g('year'), m: g('month'), d: g('day'), h: g('hour') };
}
function diaAbierto(fecha) {
  const p = partes(fecha);
  if (p.y > ANIO || (p.y === ANIO && p.m === 12 && p.d > 24)) return 24;
  if (p.y < ANIO || p.m !== 12) return 0;
  return Math.min(24, p.h >= HORA_APERTURA ? p.d : p.d - 1);
}

/* ---------- Utilidades ---------- */
// Para móviles algo antiguos sin roundRect.
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    const a = Array.isArray(r) ? r : [r, r, r, r];
    const [tl, tr, br, bl] = [a[0] || 0, a[1] ?? a[0] ?? 0, a[2] ?? a[0] ?? 0, a[3] ?? a[1] ?? a[0] ?? 0];
    this.moveTo(x + tl, y); this.lineTo(x + w - tr, y); this.quadraticCurveTo(x + w, y, x + w, y + tr);
    this.lineTo(x + w, y + h - br); this.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
    this.lineTo(x + bl, y + h); this.quadraticCurveTo(x, y + h, x, y + h - bl);
    this.lineTo(x, y + tl); this.quadraticCurveTo(x, y, x + tl, y); this.closePath();
  };
}
function rngF(seed) { let s = seed; return () => ((s = (s * 16807) % 2147483647) / 2147483647); }
const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
const ease = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
function lienzo(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function mezcla(h1, h2, t) {
  const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
  const m = (s) => Math.round(((a >> s) & 255) * (1 - t) + ((b >> s) & 255) * t);
  return `rgb(${m(16)},${m(8)},${m(0)})`;
}

/* ---------- Escena ---------- */
const cv = document.getElementById('pueblo');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, fondo = null, CASAS = [], FILAS = [], COPOS = [], BOKEH = [], COPO_SPR = null;
let ABIERTO = 0, ANIM = null, ZOOM = { s: 1, x: 0, y: 0 };
const hechos = new Set();
try { for (let i = 1; i <= 24; i++) if (localStorage.getItem('adviento-' + i) === 'hecho') hechos.add(i); } catch (e) { /* sin almacenamiento */ }

const PAREDES = ['#efe2c6', '#c7a98a', '#9fb4d3', '#d9b8a8', '#b9c7b0', '#e6cfa1'];
const TEJADOS = ['#7a1f2e', '#5c2a3a', '#3e3350', '#6b2f2a'];
const LUCES = ['#ffd27a', '#ff8f6b', '#9fe0b0', '#ffe9b0', '#ff6b7a'];

function cielo() {
  fondo = lienzo(W, H);
  const c = fondo.getContext('2d'), r = rngF(5);
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#070d22'); g.addColorStop(0.45, '#13204a'); g.addColorStop(1, '#2a3b6e');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  // luna con halo
  const mx = W * 0.8, my = H * 0.1, mr = Math.min(W, H) * 0.05;
  const halo = c.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 6);
  halo.addColorStop(0, 'rgba(255,240,205,.35)'); halo.addColorStop(1, 'rgba(255,240,205,0)');
  c.fillStyle = halo; c.fillRect(0, 0, W, H);
  const lg = c.createRadialGradient(mx - mr * 0.3, my - mr * 0.3, mr * 0.1, mx, my, mr);
  lg.addColorStop(0, '#fffaf0'); lg.addColorStop(1, '#e9dfc2');
  c.fillStyle = lg; c.beginPath(); c.arc(mx, my, mr, 0, TAU); c.fill();
  // estrellas
  for (let i = 0, n = W * H / 4200; i < n; i++) {
    const y = r() * H * 0.45, a = 0.25 + r() * 0.6 * (1 - y / (H * 0.45));
    c.fillStyle = `rgba(235,240,255,${a})`; c.beginPath(); c.arc(r() * W, y, (0.4 + r() * 0.9) * DPR, 0, TAU); c.fill();
  }
  // montañas lejanas
  for (const [base, col, amp] of [[0.3, '#1a2a58', 0.05], [0.34, '#22346a', 0.035]]) {
    c.fillStyle = col; c.beginPath(); c.moveTo(0, H);
    for (let x = 0; x <= W; x += W / 30) c.lineTo(x, H * base - Math.abs(Math.sin(x / W * 5 + base * 20)) * H * amp);
    c.lineTo(W, H); c.closePath(); c.fill();
  }
}
function copoSprite() {
  const s = 32, c = lienzo(s, s), x = c.getContext('2d');
  const g = x.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0, 'rgba(255,255,255,0.95)'); g.addColorStop(0.35, 'rgba(255,255,255,0.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, s, s);
  return c;
}

function geometria() {
  const y0 = H * 0.3, y1 = H * 0.985, filaH = (y1 - y0) / 6, colW = W / 4;
  const orden = [7, 15, 2, 20, 11, 23, 5, 17, 1, 13, 9, 21, 18, 4, 24, 10, 14, 22, 6, 16, 3, 19, 12, 8];
  const r = rngF(24);
  CASAS = []; FILAS = [];
  for (let f = 0; f < 6; f++) {
    const esc = 0.84 + 0.16 * f / 5;
    const w = Math.min(colW * 0.7, filaH * 0.86) * esc, h = w * 1.12;
    const base = y0 + filaH * (f + 1) - filaH * 0.1;
    const fila = { f, base, filaH, esc, casas: [] };
    for (let c = 0; c < 4; c++) {
      const n = orden[f * 4 + c];
      const x = colW * (c + 0.5) + (f % 2 ? 1 : -1) * colW * 0.07 + (r() - 0.5) * colW * 0.06;
      const casa = { n, x, base, w, h, pared: PAREDES[(n * 5) % PAREDES.length], tejado: TEJADOS[(n * 3) % TEJADOS.length], spr: {}, temblor: 0, fase: r() * TAU };
      CASAS.push(casa); fila.casas.push(casa);
    }
    FILAS.push(fila);
  }
}

/* Dibujo de una casa en su sprite (origen: centro de la base) */
function dibujarCasa(c, k, estado) {
  const { w, h } = k, hb = h * 0.56;
  const pared = c.createLinearGradient(0, -hb, 0, 0);
  pared.addColorStop(0, mezcla(k.pared, '#ffffff', 0.18)); pared.addColorStop(1, mezcla(k.pared, '#1c2c55', 0.25));
  c.fillStyle = pared; c.beginPath(); c.roundRect(-w * 0.42, -hb, w * 0.84, hb, [0, 0, w * 0.03, w * 0.03]); c.fill();
  const sombra = c.createLinearGradient(w * 0.1, 0, w * 0.42, 0);
  sombra.addColorStop(0, 'rgba(12,21,48,0)'); sombra.addColorStop(1, 'rgba(12,21,48,.35)');
  c.fillStyle = sombra; c.fillRect(w * 0.1, -hb, w * 0.32, hb);
  // chimenea
  c.fillStyle = mezcla(k.tejado, '#000000', 0.25); c.fillRect(w * 0.16, -h * 0.98, w * 0.12, h * 0.3);
  c.fillStyle = '#f3f6ff'; c.beginPath(); c.roundRect(w * 0.14, -h * 1.0, w * 0.16, h * 0.05, w * 0.03); c.fill();
  // tejado
  const tj = c.createLinearGradient(0, -h * 0.98, 0, -hb);
  tj.addColorStop(0, mezcla(k.tejado, '#ffffff', 0.12)); tj.addColorStop(1, mezcla(k.tejado, '#000000', 0.2));
  c.fillStyle = tj; c.beginPath(); c.moveTo(-w * 0.54, -hb + h * 0.01); c.lineTo(0, -h * 0.97); c.lineTo(w * 0.54, -hb + h * 0.01); c.closePath(); c.fill();
  // nieve del tejado con goterones
  c.fillStyle = '#f6f8ff';
  c.beginPath(); c.moveTo(-w * 0.57, -hb + h * 0.015); c.lineTo(0, -h * 1.0); c.lineTo(w * 0.57, -hb + h * 0.015);
  c.lineTo(w * 0.5, -hb + h * 0.035); c.lineTo(0, -h * 0.9); c.lineTo(-w * 0.5, -hb + h * 0.035); c.closePath(); c.fill();

    x.fillStyle = grad('#fff6e0', '#e8d2a8', -16, 40); x.beginPath(); x.roundRect(-14, -16, 28, 58, 3); x.fill();
    x.fillStyle = '#c9374b'; x.fillRect(-14, 6, 28, 6);
    x.beginPath(); x.moveTo(0, -46); x.quadraticCurveTo(12, -28, 0, -20); x.quadraticCurveTo(-12, -28, 0, -46); x.fillStyle = grad('#fff3b0', '#ff8f3b', -46, -20); x.fill();
  } else {
    x.strokeStyle = '#7fb3d9'; x.lineWidth = 5;
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3, ca = Math.cos(a), sa = Math.sin(a), p = (r, o = 0) => [ca * r - sa * o, sa * r + ca * o];
      x.beginPath(); x.moveTo(0, 0); x.lineTo(...p(42)); x.stroke();
      x.lineWidth = 4; for (const r of [18, 30]) { x.beginPath(); x.moveTo(...p(r)); x.lineTo(...p(r + 9, 9)); x.moveTo(...p(r)); x.lineTo(...p(r + 9, -9)); x.stroke(); }
      x.lineWidth = 5;
    }
    x.fillStyle = '#e8f3ff'; x.beginPath(); x.arc(0, 0, 6, 0, TAU); x.fill();
  }
  c.setAttribute('aria-hidden', 'true');
  return c;
}

/* ---------- Tarjeta: juego de parejas y premio ---------- */
const puerta = document.getElementById('puerta'), tarjeta = document.getElementById('tarjeta'), tablero = document.getElementById('tablero');
const juego = document.getElementById('juego'), premio = document.getElementById('premio');
let casaAbierta = null;
function abrirTarjeta(k) {
  casaAbierta = k;
  const sx = (k.x - ZOOM.x) * ZOOM.s + ZOOM.x, sy = (k.base - k.h * 0.15 - ZOOM.y) * ZOOM.s + ZOOM.y;
  tarjeta.style.setProperty('--ox', `${sx / DPR - (window.innerWidth - Math.min(370, window.innerWidth - 28)) / 2}px`);
  tarjeta.style.setProperty('--oy', `${sy / DPR - 40}px`);
  document.getElementById('pTitulo').textContent = `Día ${k.n}`;
  puerta.hidden = false; puerta.classList.remove('entra'); void puerta.offsetWidth; puerta.classList.add('entra');
  if (hechos.has(k.n)) return mostrarPremio(k.n);
  juego.hidden = false; premio.hidden = true;
  parejas(k.n);
}
function cerrarTarjeta() {
  puerta.hidden = true;
  if (casaAbierta) ANIM = { casa: casaAbierta, t0: performance.now() / 1000, d: 0.45, cerrando: true };
  casaAbierta = null;
}
function mostrarPremio(n) {
  juego.hidden = true; premio.hidden = false;
  premio.classList.remove('entra'); void premio.offsetWidth; premio.classList.add('entra');
  document.getElementById('pMsg').textContent = DIAS[n].msg;
  document.getElementById('pVale').textContent = DIAS[n].vale;
}
function parejas(n) {
  const nombres = ['estrella', 'arbol', 'campana', 'regalo', 'vela', 'copo'], mazo = nombres.concat(nombres);
  for (let i = mazo.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [mazo[i], mazo[j]] = [mazo[j], mazo[i]]; }
  tablero.replaceChildren();
  let vistas = [], movs = 0, pares = 0, bloqueo = false;
  const mMovs = document.getElementById('movs'), mPares = document.getElementById('pares');
  mMovs.textContent = '0 intentos'; mPares.textContent = '0 de 6 parejas';
  mazo.forEach((nombre) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'carta'; b.dataset.n = nombre; b.setAttribute('aria-label', 'Carta boca abajo');
    const giro = document.createElement('span'); giro.className = 'giro';
    const dorso = document.createElement('span'); dorso.className = 'dorso';
    const frente = document.createElement('span'); frente.className = 'frente'; frente.append(icono(nombre));
    giro.append(dorso, frente); b.append(giro);
    b.addEventListener('click', () => {
      if (bloqueo || b.classList.contains('vista') || b.classList.contains('hecha')) return;
      b.classList.add('vista'); b.setAttribute('aria-label', nombre);
      vistas.push(b);
      if (vistas.length < 2) return;
      movs++; mMovs.textContent = movs === 1 ? '1 intento' : `${movs} intentos`;
      const [a, c] = vistas;
      if (a.dataset.n === c.dataset.n) {
        setTimeout(() => { a.classList.replace('vista', 'hecha'); c.classList.replace('vista', 'hecha'); }, 350);
        vistas = []; pares++; mPares.textContent = `${pares} de 6 parejas`;
        if (pares === 6) {
          hechos.add(n);
          try { localStorage.setItem('adviento-' + n, 'hecho'); } catch (e) { /* sin almacenamiento */ }
          setTimeout(() => mostrarPremio(n), 1000);
        }
      } else {
        bloqueo = true;
        setTimeout(() => {
          for (const k of [a, c]) { k.classList.remove('vista'); k.classList.add('mal'); k.setAttribute('aria-label', 'Carta boca abajo'); setTimeout(() => k.classList.remove('mal'), 380); }
          vistas = []; bloqueo = false;
        }, 900);
      }
    });
    tablero.append(b);
  });
}
document.getElementById('pCerrar').addEventListener('click', cerrarTarjeta);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !puerta.hidden) cerrarTarjeta(); });

/* ---------- Arranque ---------- */
(async () => {
  const { fecha, fiable } = await horaFiable();
  ABIERTO = fiable ? diaAbierto(fecha) : 0;
  const p = partes(fecha), hoyTxt = document.getElementById('hoyTxt'), cuenta = document.getElementById('cuenta');
  if (MAQUETA) document.getElementById('maqueta').hidden = false;
  if (p.m === 12) hoyTxt.textContent = `${p.d} de ${MESES[p.m - 1]}`;
  if (!fiable) cuenta.textContent = 'Conéctate a internet para abrir las casas';
  else if (ABIERTO >= 24) cuenta.textContent = 'Feliz Nochebuena';
  else if (ABIERTO === 0) cuenta.textContent = 'La primera casa se abre el 1 de diciembre';
  else { const q = 24 - ABIERTO; cuenta.textContent = q === 1 ? 'Queda 1 día para Nochebuena' : `Quedan ${q} días para Nochebuena`; }
  for (const k of CASAS) k.spr = {};
})();
let rt = 0;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 150); });
resize();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { for (const k of CASAS) k.spr = {}; });
requestAnimationFrame(frame);
})();
</script>
