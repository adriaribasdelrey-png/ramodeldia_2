<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ramo del día</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d0206">
<style>
  html,body{margin:0;height:100%;background:#0d0206;color:#d4bd98}
  body{display:flex;align-items:center;justify-content:center;font:italic 18px/1.4 Georgia,serif;text-align:center}
  a{color:#ecdcbd}
</style>
<script src="dias.js"></script>
</head>
<body>
<p id="msg">Abriendo el ramo del día…</p>
<noscript><p>Para ver el ramo hay que activar JavaScript.</p></noscript>
<script>
(() => {
  // El ramo cambia cada día a las 7:00, según la hora del propio móvil.
  const HORA_CAMBIO = 7;
  const ahora = new Date();
  if (ahora.getHours() < HORA_CAMBIO) ahora.setDate(ahora.getDate() - 1);
  const p2 = (n) => String(n).padStart(2, '0');
  const hoy = `${ahora.getFullYear()}-${p2(ahora.getMonth() + 1)}-${p2(ahora.getDate())}`;
  const dias = (Array.isArray(window.DIAS) ? window.DIAS : []).filter((d) => /^\d{4}-\d{2}-\d{2}$/.test(d)).sort();
  if (!dias.length) { document.getElementById('msg').textContent = 'Todavía no hay ningún ramo.'; return; }
  // El de hoy; si aún no está, el último que haya antes; y si no, el primero.
  let elegido = dias[0];
  for (const d of dias) if (d <= hoy) elegido = d;
  location.replace(`dias/${elegido}.html`);
})();
</script>
</body>
</html>
